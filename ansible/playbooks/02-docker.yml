---
- name: Instalar Docker
  hosts: web
  become: true

  tasks:
    - name: Comprobar si Docker ya esta instalado
      command: docker --version
      register: docker_check
      ignore_errors: true
      changed_when: false

    - name: Instalar Docker y plugin compose si no existe
      apt:
        name:
          - docker.io
          - docker-compose
        state: present
        update_cache: true
      when: docker_check.rc != 0

    - name: Asegurar servicio Docker arrancado
      service:
        name: docker
        state: started
        enabled: true

    - name: Añadir ubuntu al grupo docker
      user:
        name: ubuntu
        groups: docker
        append: true
