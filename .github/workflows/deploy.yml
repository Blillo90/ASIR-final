name: Deploy to EC2 with Ansible

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Limpiar repos problematicos
        run: |
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list

      - name: Instalar Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Configurar clave SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Sustituir IP en inventario
        run: |
          sed -i "s/TU_IP_PUBLICA_EC2/${{ secrets.EC2_HOST }}/g" ansible/inventory/hosts.ini

      - name: Mostrar inventario resultante
        run: |
          cat ansible/inventory/hosts.ini

      - name: Probar conectividad Ansible
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible all -i ansible/inventory/hosts.ini -m ping --private-key ~/.ssh/id_ed25519
          
      - name: Debug clave SSH
        run: |
          echo "=== Primeros 40 chars de la clave ==="
          head -1 ~/.ssh/id_ed25519
          echo "=== Últimos 40 chars ==="
          tail -1 ~/.ssh/id_ed25519
          echo "=== Permisos ==="
          ls -la ~/.ssh/id_ed25519
          echo "=== Test SSH directo ==="
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o BatchMode=yes ubuntu@${{ secrets.EC2_HOST }} "echo OK" 2>&1

      - name: Ejecutar playbook completo
        run: |
          ANSIBLE_HOST_KEY_CHECKING=False ansible-playbook -i ansible/inventory/hosts.ini ansible/playbooks/site.yml --private-key ~/.ssh/id_ed25519
