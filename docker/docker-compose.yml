services:
  app-db:
    image: mariadb:11
    container_name: asir-final-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: incidencias
      MYSQL_USER: inc_user
      MYSQL_PASSWORD: root
    volumes:
      - mariadb_data:/var/lib/mysql

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: asir-final-web
    restart: unless-stopped
    depends_on:
      - app-db
    ports:
      - "80:5000"
    environment:
      DB_HOST: app-db
      DB_PORT: 3306
      DB_NAME: incidencias
      DB_USER: inc_user
      DB_PASSWORD: root

volumes:
  mariadb_data: